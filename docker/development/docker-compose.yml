services:
  npm:
    image: node:24-alpine
    working_dir: /app
    entrypoint: npm
    ports:
      - '3000:3000'
    volumes:
      - ../../:/app
      # Container-local node_modules/.next — sharing host binaries corrupts Turbopack.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
